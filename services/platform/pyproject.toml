[project]
name = "open-cycling-workshop-platform"
version = "0.1.0.dev0"
description = "Open source local-first operating platform for bicycle workshops"
requires-python = ">=3.13,<3.14"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "fastapi>=0.128,<0.129",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.50,<2.1",
  "alembic>=1.18,<2",
  "uvicorn>=0.48,<0.49",
  "PyJWT>=2.13,<3",
  "argon2-cffi>=25.1,<26",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
ocwp-api = "cycling_workshop.app:run"
ocwp-worker = "cycling_workshop.worker:main"
ocwpctl = "cycling_workshop.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cycling_workshop"]
