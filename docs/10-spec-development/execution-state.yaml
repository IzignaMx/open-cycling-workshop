session_2026_08_30_fixes:
  bugs_found_and_fixed_by_real_execution:
    - security workflow pinned aquasecurity/trivy-action@0.31.0 (nonexistent tag) corrected to @v0.31.0
    - dev dependencies were missing httpx required by starlette TestClient; added and locked
    - pytest lacked pythonpath configuration; added [".", "services/platform/src"] so `uv run pytest -q` works outside the original container
    - 132 ruff violations (E501, B904, E731, SIM108, SIM115, RUF043, I001) fixed properly without weakening configuration
    - mypy assignment narrowing failure in sync service fixed by renaming the re-fetched customer variable
    - repository tests were not hermetic against developer git config (commit.gpgsign hang) and used POSIX-only unzip; made hermetic via GIT_CONFIG_GLOBAL/GIT_CONFIG_SYSTEM and zipfile
    - publish-script test resolved WSL bash on Windows; now resolves Git for Windows bash explicitly
    - runtime HTTP smoke failed Windows temp cleanup after uvicorn termination; TemporaryDirectory ignore_cleanup_errors added
    - frontend test tools spawned tsc shims unspawnable on Windows; now run the resolved typescript/bin/tsc via process.execPath
    - api-client package lacked a typescript devDependency so its scripts could not run
    - eslint config gained node/browser globals for mjs tools, underscore omission pattern, and a documented exemption for the offline typecheck shim
    - prettier ignores generated artifacts (lockfiles, generated client) so contract --check regeneration stays byte-stable
    - vite preview lacked its proxy block so CI-mode E2E against the production build could never reach the backend
    - ApiClient and HttpSyncTransport stored a detached `fetch` reference which throws Illegal invocation in browsers; bound to globalThis
    - E2E seed and ocwpctl bootstrap_admin hit PostgreSQL FK violations because the unit of work emitted users before tenancy parents (masked by SQLite not enforcing FKs); explicit flush of parents added
    - sync status showed generic error instead of offline when the network dropped mid-flight; transport now classifies network-level failures as SyncTransportOfflineError and the app retries every 2s while offline because navigator.onLine and the online event are unreliable
  evidence:
    golden_slice_e2e: passed_2026_08_30_local_windows_postgresql_18_4_docker_production_pwa_preview

