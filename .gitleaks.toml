title = "OCWP default rules with reviewed exact false-positive exceptions"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Invalid JWT-shaped log-redaction fixture; signature is a literal placeholder"
condition = "AND"
paths = ['''^tests/operations/test_local_compose_runtime\.py$''']
regexTarget = "secret"
regexes = ['''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJhIn0\.signature$''']

[[rules.allowlists]]
description = "Historical README prose describing revocable sessions; not credential data"
condition = "AND"
paths = ['''^README\.md$''']
regexTarget = "secret"
regexes = ['''^signed/revocable$''']

[[rules.allowlists]]
description = "Public execution-state prose describing JSON diagnostic byte accounting; not credential data"
condition = "AND"
paths = ['''^docs/10-spec-development/execution-state\.yaml$''']
regexTarget = "secret"
regexes = ['''^may_expand_beyond_retained_utf8_bytes$''']

[[rules.allowlists]]
description = "Three public source SHA256 provenance values; independently recomputed from a960bdd"
condition = "AND"
paths = ['''^docs/site/screenshots\.json$''']
regexTarget = "secret"
regexes = ['''^(?:b9e907a3a280f5283675258d58ea19767c002408e91dbab4a97a0adaebceb544|98221a1c2e0984fda8173ae7903158dd26aa1bfd72dd6f791b6ba0c1b35138f0|454e53d07c4329d205e2d66224524c3c288eea8bced38d3af03cd8c6ccbb0a7a)$''']
