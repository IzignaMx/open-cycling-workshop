name: Sync bootstrap/v0.1 with Checkpoint I

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[sync-bootstrap-v01]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary workflow and align branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git rm .github/workflows/sync-bootstrap-v01.yml
          git commit -m "chore: align bootstrap/v0.1 with Checkpoint I

          Signed-off-by: OpenAI <noreply@openai.com>"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          git push --force origin HEAD:bootstrap/v0.1
