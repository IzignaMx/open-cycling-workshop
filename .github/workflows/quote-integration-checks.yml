name: Fixed quote integration checks

on:
  push:
    branches: [codex/quote-integration-checks]

permissions:
  contents: read

jobs:
  quote-integration-checks:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/quote-integration-checks' &&
      github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Source-bound case counts: 51, 68, 62 and 6, respectively.
        group: [guard_core, guard_service, pure_remaining, static]
    env:
      OCWP_INTEGRATION_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse any other event, branch, workflow, run or attempt
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/quote-integration-checks
          test "$GITHUB_RUN_NUMBER" = 1
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/quote-integration-checks.yml@$GITHUB_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare the immutable exact-source image with locked application and development dependencies
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 660s \
            python3 -I scripts/ci/quote_integration_checks.py prepare
      - name: Prove real containment and run the fixed group once
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 120s \
            python3 -I scripts/ci/quote_integration_checks.py run
      - name: Independently reconcile ownership and prove final absence
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 55s \
            python3 -I scripts/ci/quote_integration_checks.py cleanup
      - name: Upload closed group evidence, bounded diagnostics and independent absence proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-integration-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            artifacts/quote-integration-${{ matrix.group }}.json
            artifacts/quote-integration-${{ matrix.group }}-independent-cleanup.json
            artifacts/quote-integration-${{ matrix.group }}-diagnostic.txt
          if-no-files-found: error
