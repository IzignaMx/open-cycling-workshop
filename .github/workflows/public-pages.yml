name: Manual public Pages publication

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Previously qualified full main commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.expected_source_sha == github.sha
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.17.0'
      - name: Install existing locked browser tooling
        run: pnpm install --frozen-lockfile
      - name: Build only current allowlisted public documentation
        run: python3 scripts/docs/build_public_site.py --require-current --output artifacts/public-site/open-cycling-workshop
      - name: Install Chromium
        run: pnpm --filter @ocwp/web exec playwright install --with-deps chromium
      - name: Check repository subpath before publication
        run: pnpm --filter @ocwp/web exec playwright test --config playwright.public-site.config.ts
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: artifacts/public-site/open-cycling-workshop
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && inputs.expected_source_sha == github.sha
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only this run's checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    if: github.ref == 'refs/heads/main' && inputs.expected_source_sha == github.sha
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.17.0'
      - name: Install existing locked browser tooling
        run: pnpm install --frozen-lockfile
      - name: Rebuild deterministic exact-source comparison
        run: python3 scripts/docs/build_public_site.py --require-current --output artifacts/public-site/open-cycling-workshop
      - name: Validate returned destination and deployed public bytes
        run: python3 scripts/docs/verify_public_site.py --url "$PUBLIC_SITE_URL" --directory artifacts/public-site/open-cycling-workshop
      - name: Install Chromium
        run: pnpm --filter @ocwp/web exec playwright install --with-deps chromium
      - name: Validate actual live site without application credentials
        run: pnpm --filter @ocwp/web exec playwright test --config playwright.public-site-live.config.ts
      - name: Preserve source-bound live browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-pages-live-${{ github.sha }}
          path: |
            artifacts/public-site/
            apps/web/test-results/public-site-live/
            apps/web/playwright-report/public-site-live/
          if-no-files-found: error
          retention-days: 14
