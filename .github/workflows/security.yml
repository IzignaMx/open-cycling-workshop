name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action@v2 requires a paid license for organization
      # repositories; run the pinned upstream image directly instead.
      - name: Secret scanning with Gitleaks
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          entrypoint: gitleaks
          args: detect --source /github/workspace --redact --exit-code 1 --verbose

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.15'
          enable-cache: true
      - name: Verify REUSE and SPDX license metadata
        run: uvx reuse lint

      - name: Dependency audit with pip-audit
        run: uvx pip-audit

      - name: Filesystem and dependency scan with Trivy
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
