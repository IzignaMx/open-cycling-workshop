name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.15'
          enable-cache: true
      # The checked wrapper runs the digest-pinned gitleaks image as the
      # checkout owner and rejects scanner errors or empty history coverage.
      - name: Qualify exact Gitleaks false-positive policy
        run: python scripts/ci/check_secret_scan_policy.py

      - name: Secret scanning with Gitleaks
        run: python scripts/ci/security_scan.py secrets

      - name: Verify REUSE and SPDX license metadata
        run: uvx --from "reuse[charset-normalizer]" reuse lint

      - name: Dependency audit with pip-audit
        run: >-
          uv run --no-project --with packaging==26.3 --python 3.13
          python scripts/ci/security_scan.py dependencies

      - name: Preserve security coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-coverage-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error

      # The action's installer downloads a binary at run time and breaks on
      # runner/network changes; run the pinned upstream image directly.
      - name: Filesystem and dependency scan with Trivy
        uses: docker://aquasec/trivy:0.63.0
        with:
          entrypoint: trivy
          args: >-
            fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1
            --ignore-unfixed /github/workspace
