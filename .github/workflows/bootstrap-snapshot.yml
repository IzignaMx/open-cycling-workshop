name: Bootstrap exact V0.1 snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: contains(github.event.head_commit.message, '[bootstrap-exact-snapshot]')
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble archive from content-addressed Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          shas = [
            '7e5628f5fe9fe41b066cdd5bab908087140b69b4',
            '83982fc60eee957dee621ce9a8b9bd00290b2d20',
