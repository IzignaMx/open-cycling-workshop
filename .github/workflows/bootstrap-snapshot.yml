              for sha in shas:
                  req = urllib.request.Request(
                      f'https://api.github.com/repos/{repository}/git/blobs/{sha}',
                      headers={
                          'Authorization': f'Bearer {token}',
                          'Accept': 'application/vnd.github+json',
                          'X-GitHub-Api-Version': '2022-11-28',
                      },
                  )
                  with urllib.request.urlopen(req) as response:
                      payload = json.load(response)
                  out.write(base64.b64decode(payload['content']))
          PY
          echo "fb839bcba18d25b599c42599019de4b88e17b21bd1b7df3c94b94564df127276  /tmp/h-tree.tar.xz" | sha256sum -c -

      - name: Rebuild and verify exact Git tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/h-tree /tmp/h-repo
          mkdir -p /tmp/h-tree /tmp/h-repo
          tar -xJf /tmp/h-tree.tar.xz -C /tmp/h-tree
          cd /tmp/h-repo
          git init
          git checkout -b main
          cp -a /tmp/h-tree/. .
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -f -A
          actual_tree="$(git write-tree)"
          expected_tree="4f390d812b5aa094bd943e4112a558e5adae61b8"
          printf 'actual tree:   %s\nexpected tree: %s\n' "$actual_tree" "$expected_tree"
          test "$actual_tree" = "$expected_tree"
          git commit -m "feat: import Open Cycling Workshop Platform V0.1 foundations

          Signed-off-by: OpenAI <noreply@openai.com>"

      - name: Publish verified snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/h-repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/main
          git push --force origin HEAD:refs/heads/bootstrap/v0.1
