name: Local runtime

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.17.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ocwp/web exec playwright install --with-deps chromium
      - name: Fresh amd64 stack, real edge/offline, persistence and PostgreSQL restore
        run: python scripts/ci/local_compose_smoke.py --browser --evidence artifacts/local-runtime.json
      - name: Upload exact-commit runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-evidence
          path: artifacts/local-runtime.json
          if-no-files-found: error

  arm64-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [platform.local, web, operations]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate ARM64 image build, without publishing or claiming hardware qualification
        if: matrix.image != 'platform.local'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=local-runtime-${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=local-runtime-${{ matrix.image }}-arm64
      - name: Load ephemeral ARM64 API image without publishing
        if: matrix.image == 'platform.local'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/platform.local.Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ocwp-branding-arm64:${{ github.sha }}
          cache-from: type=gha,scope=local-runtime-platform.local-arm64
          cache-to: type=gha,mode=max,scope=local-runtime-platform.local-arm64
      - name: Probe installed decoder under QEMU, never native Raspberry qualification
        if: matrix.image == 'platform.local'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          image="ocwp-branding-arm64:${{ github.sha }}"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          image_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
          docker run --rm --pull never --platform linux/arm64 \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --init --entrypoint python -i "$image" -I - \
            --commit "$(git rev-parse HEAD)" \
            --image-id "$image_id" --image-platform "$image_platform" \
            < scripts/ci/branding_image_probe.py \
            > artifacts/branding-arm64-emulated.json
      - name: Upload bounded emulated ARM64 decoder evidence
        if: always() && matrix.image == 'platform.local'
        uses: actions/upload-artifact@v4
        with:
          name: branding-arm64-emulated-${{ github.sha }}
          path: artifacts/branding-arm64-emulated.json
          if-no-files-found: error
