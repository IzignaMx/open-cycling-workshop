name: Local runtime

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.17.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ocwp/web exec playwright install --with-deps chromium
      - name: Fresh amd64 stack, real edge/offline, persistence and PostgreSQL restore
        run: python scripts/ci/local_compose_smoke.py --browser --evidence artifacts/local-runtime.json
      - name: Upload exact-commit runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-evidence
          path: artifacts/local-runtime.json
          if-no-files-found: error

  arm64-native-decoder:
    if: github.event.repository.private == false && toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Qualify installed decoder on standard native ARM64, never Raspberry hardware
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            printf '{"schema_version":1,"execution":"native-linux-arm64","physical_device_qualified":false,"status":"failed","failure":"%s"}\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"
            exit "${2:-1}"
          }
          host_machine="$(uname -m)"
          host_elf="$(python3 -I -c 'import runpy, sys; p = runpy.run_path("scripts/ci/branding_image_probe.py"); print(p["elf_machine"](open(sys.executable, "rb").read(20)))' 2>/dev/null)" || fail native_host_identity
          docker_arch="$(docker info --format '{{.Architecture}}' 2>/dev/null)" || fail native_host_identity
          if [[ "$host_machine" != aarch64 || "$host_elf" != 183 || "${RUNNER_ARCH:-}" != ARM64 ]]; then
            fail native_host_identity
          fi
          if [[ "$docker_arch" != aarch64 && "$docker_arch" != arm64 ]]; then
            fail native_host_identity
          fi
          commit="$(git rev-parse HEAD)"
          worker_sha="$(git show "$commit:services/platform/src/cycling_workshop/branding/images.py" | sha256sum | cut -d ' ' -f 1)"
          image="ocwp-branding-native-arm64:$commit"
          timeout --signal=TERM --kill-after=5s 900s docker build --platform linux/arm64 \
            --file infra/docker/platform.local.Dockerfile --tag "$image" . \
            >/dev/null 2>&1 || fail native_image_build_failed "$?"
          image_id="$(docker image inspect --format '{{.Id}}' "$image" 2>/dev/null)" || fail native_image_identity
          image_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image" 2>/dev/null)" || fail native_image_identity
          report="$(mktemp "$RUNNER_TEMP/branding-native.XXXXXX")"
          container="ocwp-branding-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'status=$?; timeout --signal=TERM --kill-after=5s 10s docker rm --force "$container" >/dev/null 2>&1 || true; rm -f "$report"; exit "$status"' EXIT
          status=0
          timeout --signal=TERM --kill-after=5s 30s docker run --rm --name "$container" \
            --pull never --platform linux/arm64 \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --init --entrypoint python -i "$image_id" -I - \
            --commit "$commit" --image-id "$image_id" --image-platform "$image_platform" \
            --execution native-linux-arm64 --host-machine "$host_machine" \
            --host-elf-machine "$host_elf" --runner-arch "$RUNNER_ARCH" --docker-arch "$docker_arch" \
            < scripts/ci/branding_image_probe.py > "$report" 2>/dev/null || status=$?
          python3 -I scripts/ci/branding_image_probe.py \
            --commit "$commit" --image-id "$image_id" --image-platform "$image_platform" \
            --execution native-linux-arm64 --host-machine "$host_machine" \
            --host-elf-machine "$host_elf" --runner-arch "$RUNNER_ARCH" --docker-arch "$docker_arch" \
            --worker-sha256 "$worker_sha" --validate-native-report "$report" --probe-exit-code "$status" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  arm64-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [platform.local, web, operations]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate ARM64 image build, without publishing or claiming hardware qualification
        if: matrix.image != 'platform.local'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=local-runtime-${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=local-runtime-${{ matrix.image }}-arm64
      - name: Load ephemeral ARM64 API image without publishing
        if: matrix.image == 'platform.local'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/platform.local.Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ocwp-branding-arm64:${{ github.sha }}
          cache-from: type=gha,scope=local-runtime-platform.local-arm64
          cache-to: type=gha,mode=max,scope=local-runtime-platform.local-arm64

  arm64-qualification:
    needs: [arm64-build, arm64-native-decoder]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ARM64_BUILD_RESULT: ${{ needs.arm64-build.result }}
      ARM64_NATIVE_RESULT: ${{ needs.arm64-native-decoder.result }}
    steps:
      - name: Require all three ARM64 builds and actual native decoder execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ARM64_BUILD_RESULT" != success || "$ARM64_NATIVE_RESULT" != success ]]; then
            printf '%s\n' 'ARM architecture qualification FAILED or unavailable; physical Raspberry qualification remains OPEN.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '%s\n' 'Three ARM64 builds and native installed-decoder smoke passed; QEMU is NON-QUALIFYING; physical Raspberry qualification remains OPEN.' | tee -a "$GITHUB_STEP_SUMMARY"
