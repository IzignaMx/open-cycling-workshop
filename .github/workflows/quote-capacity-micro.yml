name: Quote containment microfixture (NOT capacity qualification)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quote-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build exact archived source with existing pinned runtime and lock
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          context="$(mktemp -d "$RUNNER_TEMP/quote-source.XXXXXX")"
          git archive HEAD | tar -x -C "$context"
          tree="$(git rev-parse HEAD^{tree})"
          timeout --signal=TERM --kill-after=5s 300s docker build --target build \
            -f "$context/infra/docker/platform.local.Dockerfile" -t ocwp-quote-base "$context"
          cat > "$RUNNER_TEMP/quote-proof.Dockerfile" <<'DOCKERFILE'
          FROM ocwp-quote-base
          RUN uv sync --all-packages --group dev --locked
          COPY tests /app/tests
          COPY scripts /app/scripts
          ARG SOURCE_TREE
          LABEL ocwp.source-tree=$SOURCE_TREE
          ENV PYTHONDONTWRITEBYTECODE=1
          DOCKERFILE
          timeout --signal=TERM --kill-after=5s 300s docker build \
            -f "$RUNNER_TEMP/quote-proof.Dockerfile" --build-arg "SOURCE_TREE=$tree" \
            -t ocwp-quote-micro "$context"
          timeout --signal=TERM --kill-after=5s 60s docker pull postgres:18.4-trixie
      - name: Verify containment before three operations only
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 120s python3 scripts/ci/quote_capacity_micro.py \
            --worker-image ocwp-quote-micro --pg-image postgres:18.4-trixie \
            --commit "$(git rev-parse HEAD)" --owned "$RUNNER_TEMP/quote-owned.json" \
            --evidence artifacts/quote-capacity-micro.json
      - name: Verify one fixed record shape only
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 120s python3 scripts/ci/quote_capacity_micro.py \
            --worker-image ocwp-quote-micro --pg-image postgres:18.4-trixie \
            --commit "$(git rev-parse HEAD)" --owned "$RUNNER_TEMP/quote-record-owned.json" \
            --evidence artifacts/quote-record-feasibility.json --single-record-feasibility
      - name: Independently verify owned containers absent even after supervisor failure
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from contextlib import suppress
          from scripts.ci.quote_capacity_micro import ProofFailure, diagnosed_full_reconcile, run
          root = Path(os.environ['RUNNER_TEMP'])
          failed = False
          with suppress(OSError):
              Path('artifacts').mkdir(exist_ok=True)
          for stem in ('quote-owned', 'quote-record-owned'):
              try:
                  diagnosed_full_reconcile(
                      root / f'{stem}.json', run,
                      Path('artifacts') / f'{stem}-finalizer-cleanup.json',
                      kind='ocwp.quote_micro.cleanup_diagnostic',
                  )
              except (ProofFailure, ValueError, OSError):
                  failed = True
          if failed:
              raise SystemExit('Owned-container cleanup unverified')
          PY
      - name: Upload closed microfixture evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-capacity-micro-${{ github.sha }}
          path: artifacts/quote-capacity-micro.json
          if-no-files-found: error
      - name: Upload fixed record feasibility evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-record-feasibility-${{ github.sha }}
          path: artifacts/quote-record-feasibility.json
          if-no-files-found: error
      - name: Upload bounded cleanup observations (not workload receipts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-micro-cleanup-diagnostics-${{ github.sha }}
          path: |
            artifacts/quote-capacity-micro.cleanup.json
            artifacts/quote-record-feasibility.cleanup.json
            artifacts/quote-owned-finalizer-cleanup.json
            artifacts/quote-record-owned-finalizer-cleanup.json
          if-no-files-found: error
