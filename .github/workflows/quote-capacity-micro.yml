name: Quote containment microfixture (NOT capacity qualification)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quote-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build exact archived source with existing pinned runtime and lock
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          context="$(mktemp -d "$RUNNER_TEMP/quote-source.XXXXXX")"
          git archive HEAD | tar -x -C "$context"
          tree="$(git rev-parse HEAD^{tree})"
          timeout --signal=TERM --kill-after=5s 300s docker build --target build \
            -f "$context/infra/docker/platform.local.Dockerfile" -t ocwp-quote-base "$context"
          cat > "$RUNNER_TEMP/quote-proof.Dockerfile" <<'DOCKERFILE'
          FROM ocwp-quote-base
          RUN uv sync --all-packages --group dev --locked
          COPY tests /app/tests
          COPY scripts /app/scripts
          ARG SOURCE_TREE
          LABEL ocwp.source-tree=$SOURCE_TREE
          ENV PYTHONDONTWRITEBYTECODE=1
          DOCKERFILE
          timeout --signal=TERM --kill-after=5s 300s docker build \
            -f "$RUNNER_TEMP/quote-proof.Dockerfile" --build-arg "SOURCE_TREE=$tree" \
            -t ocwp-quote-micro "$context"
          timeout --signal=TERM --kill-after=5s 60s docker pull postgres:18.4-trixie
      - name: Verify containment before three operations only
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 120s python3 scripts/ci/quote_capacity_micro.py \
            --worker-image ocwp-quote-micro --pg-image postgres:18.4-trixie \
            --commit "$(git rev-parse HEAD)" --owned "$RUNNER_TEMP/quote-owned.json" \
            --evidence artifacts/quote-capacity-micro.json
      - name: Independently verify owned containers absent even after supervisor failure
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.ci.quote_capacity_micro import identifier, reconcile_owned, remove_owned, run
          root = Path(os.environ['RUNNER_TEMP'])
          ids = [identifier(path.read_text().strip()) for path in root.glob('quote-owned.*.cid')]
          present = run(['docker', 'ps', '--all', '--no-trunc', '--format', '{{.ID}}']).splitlines()
          owned = root / 'quote-owned.json'
          discovered = reconcile_owned(owned) if owned.with_suffix('.owner.json').exists() else []
          if not set(ids).intersection(present).issubset(discovered):
              raise SystemExit('Owned-container identity reconciliation failed')
          remove_owned(discovered)
          PY
      - name: Upload closed microfixture evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-capacity-micro-${{ github.sha }}
          path: artifacts/quote-capacity-micro.json
          if-no-files-found: error
