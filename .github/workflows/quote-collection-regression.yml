name: Fixed quote collection correction regressions

on:
  push:
    branches: [codex/quote-collection-regression-proof]

permissions:
  contents: read

jobs:
  quote-collection-regression-proof:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/quote-collection-regression-proof' &&
      github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse any other event, branch, workflow, run or attempt
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/quote-collection-regression-proof
          test "$GITHUB_RUN_NUMBER" = 1
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/quote-collection-regression.yml@$GITHUB_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare the immutable fixed test image with locked development dependencies
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 660s \
            python3 -I scripts/ci/quote_collection_regression.py prepare
      - name: Prove real containment and run the fixed eight correction regressions once
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 120s \
            python3 -I scripts/ci/quote_collection_regression.py run
      - name: Independently reconcile ownership and prove final absence
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 55s \
            python3 -I scripts/ci/quote_collection_regression.py cleanup
      - name: Upload only closed regression evidence and independent absence proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-collection-regression-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            artifacts/quote-collection-regression.json
            artifacts/quote-collection-regression-independent-cleanup.json
          if-no-files-found: error
