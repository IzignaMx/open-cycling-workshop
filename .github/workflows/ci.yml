name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      nonce: ${{ steps.identity.outputs.nonce }}
      image_id: ${{ steps.prepare.outputs.image_id }}
      pg_image_id: ${{ steps.prepare.outputs.pg_image_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind this exact source and fresh attempt
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          nonce="$(tr -d '-' < /proc/sys/kernel/random/uuid)"
          printf 'nonce=%s\n' "$nonce" >> "$GITHUB_OUTPUT"
      - name: Prepare the fixed locked full-Python image and matching PostgreSQL clients
        id: prepare
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          context="$(mktemp -d "$RUNNER_TEMP/full-python-source.XXXXXX")"
          git archive HEAD | tar -x -C "$context"
          export OCWP_FULL_CONTEXT="$context"
          cat > "$RUNNER_TEMP/full-python.Dockerfile" <<'DOCKERFILE'
          FROM node:22.16.0-bookworm-slim AS node
          RUN npm install --global pnpm@11.17.0
          WORKDIR /app
          COPY . /app
          RUN pnpm install --frozen-lockfile
          FROM ghcr.io/astral-sh/uv:0.11.15 AS uv
          FROM python:3.13.14-slim-trixie
          COPY --from=uv /uv /bin/uv
          COPY --from=node /usr/local/bin/node /usr/local/bin/node
          COPY --from=node /usr/local/lib/node_modules /usr/local/lib/node_modules
          RUN ln -s /usr/local/lib/node_modules/pnpm/bin/pnpm.cjs /usr/local/bin/pnpm
          ENV UV_LINK_MODE=copy UV_PYTHON_DOWNLOADS=never PYTHONDONTWRITEBYTECODE=1
          WORKDIR /app
          COPY --from=node /app /app
          RUN uv sync --all-packages --group dev --locked
          RUN set -eu; apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg git libstdc++6 \
              && install -d -m 0755 /usr/share/postgresql-common/pgdg \
              && curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              && gpg --batch --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /tmp/pgdg-key-info \
              && test "$(awk -F: '$1 == "pub" {n++} END {print n+0}' /tmp/pgdg-key-info)" = 1 \
              && test "$(awk -F: '$1 == "pub" {primary=1; next} primary && $1 == "fpr" {print $10; primary=0}' /tmp/pgdg-key-info)" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8 \
              && printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt-archive.postgresql.org/pub/repos/apt trixie-pgdg-archive main' > /etc/apt/sources.list.d/pgdg.list \
              && apt-get update -qq \
              && apt-get install -y -qq --no-install-recommends postgresql-client-18=18.4-1.pgdg13+1 libpq5=18.4-1.pgdg13+1 \
              && test "$(dpkg-query -W -f='${Version}' postgresql-client-18)" = 18.4-1.pgdg13+1 \
              && test "$(dpkg-query -W -f='${Version}' libpq5)" = 18.4-1.pgdg13+1 \
              && for tool in pg_dump pg_restore psql; do \
                   ln -s /usr/lib/postgresql/18/bin/$tool /usr/local/bin/$tool || exit 1; \
                   version="$(/usr/lib/postgresql/18/bin/$tool --version)" || exit 1; \
                   case "$version" in "$tool (PostgreSQL) 18.4"|"$tool (PostgreSQL) 18.4 (Debian 18.4-1.pgdg13+1)") ;; *) exit 1;; esac; \
                   ldd /usr/lib/postgresql/18/bin/$tool > /tmp/client-link-check || exit 1; \
                   if grep -F 'not found' /tmp/client-link-check; then exit 1; else status=$?; test "$status" -eq 1 || exit 1; fi; \
                 done \
              && ldd /usr/local/bin/node > /tmp/node-link-check \
              && if grep -F 'not found' /tmp/node-link-check; then exit 1; else status=$?; test "$status" -eq 1; fi \
              && test "$(node --version)" = v22.16.0 \
              && test "$(pnpm --version)" = 11.17.0 \
              && test "$(node -p 'require("./apps/web/node_modules/@playwright/test/package.json").version')" = 1.62.0 \
              && rm -rf /var/lib/apt/lists/* /tmp/client-link-check /tmp/node-link-check /tmp/pgdg-key-info
          ARG SOURCE_TREE
          LABEL ocwp.source-tree=$SOURCE_TREE
          DOCKERFILE
          timeout --signal=TERM --kill-after=30s 660s python3 - <<'PY'
          import os
          import time
          from pathlib import Path
          from scripts.ci.quote_capacity_micro import (
              ProofFailure, full_client, full_preparation_diagnostic, source_query,
          )
          deadline = time.monotonic() + 650
          context = os.environ['OCWP_FULL_CONTEXT']
          diagnostics = Path('artifacts/full-python')
          def execute(args, *, timeout=5, stage='source_tree'):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  full_preparation_diagnostic(None, diagnostics, stage, 'preparation_deadline', None, False)
                  raise ProofFailure('preparation_deadline')
              return full_client(args, timeout=min(timeout, remaining), preparation=(diagnostics, stage))
          tree = source_query('tree', execute)
          execute(['docker', 'build', '--quiet', '-f',
                   str(Path(os.environ['RUNNER_TEMP']) / 'full-python.Dockerfile'),
                   '--build-arg', f'SOURCE_TREE={tree}', '-t', 'ocwp-full-python', context], timeout=590, stage='image_build')
          execute(['docker', 'pull', '--quiet', 'postgres:18.4-trixie'], timeout=60, stage='postgres_pull')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, tag in [('image_id', 'ocwp-full-python'), ('pg_image_id', 'postgres:18.4-trixie')]:
                  stage = 'worker_image' if key == 'image_id' else 'postgres_image'
                  image = execute(['docker', 'image', 'inspect', '--format', '{{.Id}}', tag], stage=stage)
                  output.write(f'{key}={image}\n')
          PY
      - name: Run the complete pytest collection once inside the fixed resource boundary
        timeout-minutes: 18
        env:
          OCWP_FULL_PYTHON_NONCE: ${{ steps.identity.outputs.nonce }}
          OCWP_FULL_PYTHON_IMAGE_ID: ${{ steps.prepare.outputs.image_id }}
          OCWP_FULL_PYTHON_PG_IMAGE_ID: ${{ steps.prepare.outputs.pg_image_id }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1020s python3 -m scripts.ci.quote_capacity_micro \
            --full-python --worker-image ocwp-full-python --pg-image postgres:18.4-trixie \
            --commit "$GITHUB_SHA" --owned "$RUNNER_TEMP/full-python-owned.json" \
            --evidence artifacts/full-python/receipt.json
      - name: Independently remove owned containers and seal only complete same-source proof
        if: always()
        timeout-minutes: 1
        env:
          OCWP_FULL_PYTHON_NONCE: ${{ steps.identity.outputs.nonce }}
          OCWP_FULL_PYTHON_IMAGE_ID: ${{ steps.prepare.outputs.image_id }}
          OCWP_FULL_PYTHON_PG_IMAGE_ID: ${{ steps.prepare.outputs.pg_image_id }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 55s python3 -m scripts.ci.quote_capacity_micro \
            --finalize-full-python --worker-image ocwp-full-python --pg-image postgres:18.4-trixie \
            --commit "$GITHUB_SHA" --owned "$RUNNER_TEMP/full-python-owned.json" \
            --evidence artifacts/full-python/receipt.json
      - name: Upload the bounded full-Python receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-python-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            artifacts/full-python/receipt.json
            artifacts/full-python/diagnostic.txt
            artifacts/full-python/diagnostic.json
            artifacts/full-python/preparation.txt
            artifacts/full-python/preparation.json
            artifacts/full-python/independent-cleanup.json
          if-no-files-found: error
  verify:
    needs: python-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_USER: ocwp
          POSTGRES_PASSWORD: ocwp-test
          POSTGRES_DB: ocwp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocwp -d ocwp_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      OCWP_TEST_DATABASE_URL: postgresql+psycopg://ocwp:ocwp-test@127.0.0.1:5432/ocwp_e2e
      OCWP_E2E_DATABASE_URL: postgresql+psycopg://ocwp:ocwp-test@127.0.0.1:5432/ocwp_e2e
      OCWP_DATABASE_URL: postgresql+psycopg://ocwp:ocwp-test@127.0.0.1:5432/ocwp_e2e
      OCWP_AUTH_SECRET: ci-e2e-secret-0000000000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Exact pre-cutover App/SW source remains available.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.15'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.17.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Generate missing lockfiles
        shell: bash
        run: |
          if [[ ! -f uv.lock ]]; then
            uv lock
          fi
          if [[ ! -f pnpm-lock.yaml ]]; then
            pnpm install --lockfile-only --no-frozen-lockfile
          fi
      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: v0.1-lockfiles
          path: |
            uv.lock
            pnpm-lock.yaml
          if-no-files-found: error

      - name: Install Python workspace
        run: uv sync --all-packages --group dev --locked
      - name: Install TypeScript workspace
        run: pnpm install --frozen-lockfile

      - name: Verify repository contract
        run: uv run python scripts/ci/verify_repository.py
      - name: Run Python lint
        run: uv run ruff check services/platform/src services/platform/tests tests scripts
      - name: Run Python format check
        run: uv run ruff format --check services/platform/src services/platform/tests tests scripts
      - name: Run Python typecheck
        run: uv run mypy services/platform/src
      - name: Run frontend lint
        run: pnpm exec eslint .
      - name: Run formatting check
        run: pnpm exec prettier --check "**/*.{js,mjs,ts,tsx,json,css,md,yml,yaml}"
      - name: Download this attempt's single full-Python result
        if: always()
        continue-on-error: true # The always-run aggregate fails missing or invalid proof.
        uses: actions/download-artifact@v4
        with:
          name: full-python-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/full-python
      - name: Prove inventory PostgreSQL budgets, fresh authority and measured plans
        run: uv run python scripts/ci/inventory_read_proof.py
      - name: Prove inventory query privacy in both actual Caddy configurations
        run: uv run python scripts/ci/inventory_edge_probe.py
      - name: Upload bounded inventory database and edge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-read-${{ github.sha }}
          path: |
            artifacts/inventory-read/pg-direct/backend-postgres-evidence.json
            artifacts/inventory-read/pg-direct/backend-postgres-explain.json
            artifacts/inventory-read/edge-runtime-evidence.json
          if-no-files-found: error
      - name: Prove asset-aware branding recovery with matching PostgreSQL 18 clients
        run: bash scripts/ci/run_branding_recovery.sh
      - name: Upload safe branding recovery proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-recovery-${{ github.sha }}
          path: artifacts/branding-recovery/**/branding-recovery-evidence.json
          if-no-files-found: error
      - name: Run real HTTP runtime smoke
        run: uv run python scripts/ci/runtime_http_smoke.py
      - name: Run frontend core tests
        run: pnpm --filter @ocwp/web test:core
      - name: Run API client core tests
        run: pnpm --filter @ocwp/api-client test:core
      - name: Run frontend real typecheck
        run: pnpm --filter @ocwp/web typecheck
      - name: Typecheck inventory browser qualification
        run: pnpm --filter @ocwp/web exec tsc -p tsconfig.e2e-inventory.json
      - name: Typecheck branding browser qualification
        run: pnpm --filter @ocwp/web exec tsc -p tsconfig.e2e-branding.json
      - name: Build PWA
        run: pnpm --filter @ocwp/web build
      - name: Reproduce pinned old App and service worker
        run: node scripts/e2e/build_legacy_client.mjs artifacts/legacy-client --verify-reproducible
      - name: Verify isolated qualification helpers stay outside production
        run: node --test apps/web/tools/kernel-browser/check-production-isolation.mjs
      - name: Install Playwright Chromium
        run: pnpm --filter @ocwp/web exec playwright install --with-deps chromium
      - name: Run isolated offline kernel browser tests
        run: pnpm --filter @ocwp/web test:kernel-browser
      - name: Prepare browser E2E database
        run: uv run python scripts/e2e/prepare_e2e_database.py
      - name: Run browser E2E
        env:
          OCWP_PLAYWRIGHT_OUTPUT_DIR: test-results/direct
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/direct
        run: pnpm --filter @ocwp/web test:e2e
      - name: Upload direct browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-direct-${{ github.sha }}
          path: |
            apps/web/test-results/direct/
            apps/web/playwright-report/direct/
          if-no-files-found: warn
      - name: Repeat sync and order baseline journeys without retries
        env:
          OCWP_PLAYWRIGHT_OUTPUT_DIR: test-results/retry-free-repeat
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/retry-free-repeat
        run: >-
          pnpm --filter @ocwp/web exec playwright test e2e/sync-chaos.spec.ts e2e/order-lifecycle.spec.ts
          --grep 'baseline setup|large reconnect batch|order baseline|order lifecycle'
          --repeat-each=5 --retries=0 --workers=1
      - name: Repeat authenticated handoff and lost-ACK fences without retries
        env:
          OCWP_PLAYWRIGHT_OUTPUT_DIR: test-results/cutover-repeat
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/cutover-repeat
        run: >-
          pnpm --filter @ocwp/web exec playwright test e2e/sync-chaos.spec.ts e2e/sync-scope-integrity.spec.ts
          --grep 'lost|foreign|checkpoint|handoff' --repeat-each=3 --retries=0 --workers=1
      - name: Repeat administration probe clock without retries
        env:
          OCWP_PLAYWRIGHT_OUTPUT_DIR: test-results/administration-clock-repeat
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/administration-clock-repeat
        run: >-
          pnpm --filter @ocwp/web exec playwright test e2e/administration.spec.ts
          --grep 'automatic probe revalidation clears a newly entered administration secret'
          --repeat-each=5 --retries=0 --workers=1
      - name: Upload administration clock repetition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-administration-clock-repeat-${{ github.sha }}
          path: |
            apps/web/test-results/administration-clock-repeat/
            apps/web/playwright-report/administration-clock-repeat/
          if-no-files-found: warn
      - name: Repeat inventory expiry without retries
        id: inventory_expiry_repeat
        env:
          OCWP_PLAYWRIGHT_OUTPUT_DIR: test-results/inventory-expiry-repeat
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/inventory-expiry-repeat
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/inventory-expiry-repeat-proof/results.json
        run: |
          uv run python scripts/ci/inventory_expiry_repeat.py start
          pnpm --filter @ocwp/web exec playwright test e2e/inventory.spec.ts \
            --grep 'inventory-only display clears on .* expiry' \
            --repeat-each=5 --retries=0 --workers=1 --reporter=line,html,json
      - name: Require complete inventory expiry repetition
        if: always()
        run: uv run python scripts/ci/inventory_expiry_repeat.py check "${{ steps.inventory_expiry_repeat.outcome }}"
      - name: Upload inventory expiry repetition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-inventory-expiry-repeat-${{ github.sha }}
          path: |
            apps/web/test-results/inventory-expiry-repeat/
            apps/web/test-results/inventory-expiry-repeat-proof/
            apps/web/playwright-report/inventory-expiry-repeat/
          if-no-files-found: error
      - name: Run offline fallback typecheck
        run: pnpm --filter @ocwp/web typecheck:offline
      - name: Verify OpenAPI contract
        run: uv run python scripts/contracts/export_openapi.py --check
      - name: Verify generated TypeScript API types
        run: uv run python scripts/contracts/generate_ts_client.py --check
      - name: Typecheck generated API client
        run: pnpm --filter @ocwp/api-client typecheck
      - name: Run V0.1 qualification verifier
        if: always()
        env:
          OCWP_FULL_PYTHON_NONCE: ${{ needs.python-tests.outputs.nonce }}
          OCWP_FULL_PYTHON_IMAGE_ID: ${{ needs.python-tests.outputs.image_id }}
          OCWP_FULL_PYTHON_PG_IMAGE_ID: ${{ needs.python-tests.outputs.pg_image_id }}
        run: |
          uv run python scripts/ci/verify_v01.py --json-out artifacts/v0.1-qualification.json --allow-blocked --full-python-receipt artifacts/full-python/receipt.json
          uv run python scripts/ci/inventory_expiry_repeat.py check "${{ steps.inventory_expiry_repeat.outcome }}"
      - name: Upload V0.1 qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.1-qualification
          path: artifacts/v0.1-qualification.json
          if-no-files-found: error
      - name: Upload retry-free-repeat browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-retry-free-repeat-${{ github.sha }}
          path: |
            apps/web/test-results/retry-free-repeat/
            apps/web/playwright-report/retry-free-repeat/
          if-no-files-found: warn
      - name: Upload qualification browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-qualification-${{ github.sha }}
          path: |
            apps/web/test-results/qualification/
            apps/web/playwright-report/qualification/
          if-no-files-found: warn
      - name: Upload isolated kernel browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-kernel-browser-${{ github.sha }}
          path: apps/web/.tmp-kernel-browser-results/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload pinned legacy App and SW provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-legacy-client-${{ github.sha }}
          path: |
            fixtures/legacy-client/manifest.json
            artifacts/legacy-client/
            artifacts/legacy-client-repeated/
          if-no-files-found: error
      - name: Upload authenticated cutover repetition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-cutover-repeat-${{ github.sha }}
          path: |
            apps/web/test-results/cutover-repeat/
            apps/web/playwright-report/cutover-repeat/
          if-no-files-found: warn
